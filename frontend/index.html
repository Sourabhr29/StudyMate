<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="description" content="StudyMate — Student Daily Planner with tasks, goals, routines, reminders, notes, and focus timer." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="StudyMate" />
<title>StudyMate — Student Daily Planner</title>
<link rel="stylesheet" href="./style.css" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIwIiBmaWxsPSIjNmM4Y2ZmIi8+PHRleHQgeD0iNTAiIHk9IjUwIiBmb250LXNpemU9IjUwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjM1ZW0iPvCfjJ08L3RleHQ+PC9zdmc+" />
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="auth" class="auth-screen"></div>

<!-- ================= SHELL ================= -->
<div id="shell" class="shell hidden">
  <header class="topbar">
    <button class="icon-btn" data-action="open-drawer" aria-label="Menu">☰</button>
    <div class="brand" id="topBrand">StudyMate</div>
    <button class="icon-btn" data-action="toggle-theme" aria-label="Theme">🌙</button>
  </header>

  <main id="view" class="view"></main>

  <button class="fab" data-action="quick-add" aria-label="Add">＋</button>

  <nav class="bottomnav" id="bottomnav">
    <a href="#/home"      data-nav="home"><span class="ic">🏠</span><span>Home</span></a>
    <a href="#/calendar"  data-nav="calendar"><span class="ic">📅</span><span>Calendar</span></a>
    <a href="#/goals"     data-nav="goals"><span class="ic">🎯</span><span>Goals</span></a>
    <a href="#/progress"  data-nav="progress"><span class="ic">📊</span><span>Progress</span></a>
  </nav>
</div>

<!-- ================= DRAWER ================= -->
<div id="drawer" class="drawer">
  <div class="scrim" data-action="close-drawer"></div>
  <aside class="panel">
    <div class="drawer-head">
      <div class="avatar" id="drawerAvatar">🎓</div>
      <div style="min-width:0">
        <div style="font-weight:800;font-size:15px" id="drawerName">Student</div>
        <div class="xs muted" id="drawerSub">B.Tech · 3rd Year</div>
      </div>
    </div>
    <button class="drawer-item" data-nav-drawer="tasks"><span class="ic">📋</span> Tasks</button>
    <button class="drawer-item" data-nav-drawer="routine"><span class="ic">📅</span> Daily Routine</button>
    <button class="drawer-item" data-nav-drawer="reminders"><span class="ic">🔔</span> Reminders</button>
    <button class="drawer-item" data-nav-drawer="subjects"><span class="ic">📚</span> Subjects</button>
    <button class="drawer-item" data-nav-drawer="focus"><span class="ic">⏱️</span> Focus Timer</button>
    <button class="drawer-item" data-nav-drawer="notes"><span class="ic">📝</span> Notes</button>
    <button class="drawer-item" data-nav-drawer="achievements"><span class="ic">🏆</span> Achievements</button>
    <div class="drawer-sep"></div>
    <button class="drawer-item" data-nav-drawer="profile"><span class="ic">👤</span> Profile</button>
    <button class="drawer-item" data-nav-drawer="settings"><span class="ic">⚙️</span> Settings</button>
  </aside>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<!-- Main app script -->
<script src="./script.js"></script>

<!-- Service Worker registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('./sw.js')
        .then(registration => {
          console.log(
            'StudyMate Service Worker registered:',
            registration.scope
          );
        })
        .catch(error => {
          console.error(
            'Service Worker registration failed:',
            error
          );
        });
    });
  }
</script>

</body>
</html>
